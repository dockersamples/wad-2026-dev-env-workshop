schemaVersion: "2"
kind: mixin
name: dev-environment-setup
version: v0.1.0
displayName: Dev environment setup
description: Configures and provides an automatic dev environment for the project.

# setup:
#   startup:
#     - command:
#         [
#           "docker",
#           "compose",
#           "up",
#           "-d",
#         ]
#       description: Start the compose stack for the project

permissions:
  network:
    allow:
      - registry.npmjs.org
      - docker.io

agentInstructions:
  content: |
    ## Dev environment

    The dev environment is already up and running and accessible on port 5173 inside the sandbox (using http://localhost:5173). 

    Use this for any validation or confirmation you need to do. You can also use the dev server to test your changes in the project.

    The dev server's port is published to the host machine, allowing the user to also access the dev server
    from their local machine. The dev server is accessible to the user at http://localhost:5173.
