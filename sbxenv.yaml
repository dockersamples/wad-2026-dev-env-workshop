schemaVersion: "1"
name: wad-workshop
agent: claude

kits:
  - ./kits/dev-setup

  # Setup code server
  - docker.io/sbx/code-server-kit:20260910-34edb9066bc5d091ce74a30d8f65e2ffc89d2f21

  # Configure GitHub access and code signing
  - docker.io/sbx/git-ssh-sign-kit:20260910-34edb9066bc5d091ce74a30d8f65e2ffc89d2f21
  - docker.io/sbx/github-ssh-kit:20260910-34edb9066bc5d091ce74a30d8f65e2ffc89d2f21

workspace:
  path: .
  clone: true

additionalWorkspaces: []

sandboxOptions:
  memory: 4g
  cpus: 4
  pullPolicy: always

ports:
  - sandbox: 5173
    host: 5173
    protocol: tcp4
  - sandbox: 8080
    host: 8080
    protocol: tcp4
