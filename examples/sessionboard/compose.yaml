services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://sessionboard:sessionboard@db:5432/sessionboard
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sessionboard
      POSTGRES_PASSWORD: sessionboard
      POSTGRES_DB: sessionboard
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessionboard"]
      interval: 2s
      retries: 15
